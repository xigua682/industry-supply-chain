<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>產業供應鏈地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EDF0F5;
    --surface:#FFFFFF;
    --surface-2:#F4F6F9;
    --ink:#11161F;
    --ink-soft:#4B5563;
    --ink-faint:#8792A0;
    --line:#D7DCE3;
    --line-strong:#B9C1CC;
    --copper:#B5702A;
    --copper-ink:#8A5620;
    --copper-soft:#F1E4D3;
    --copper-soft-line:#E0C7A4;
    --signal:#1F8F6E;
    --signal-soft:#DCEFE8;
    --shadow: 0 1px 2px rgba(17,22,31,.04), 0 8px 24px -12px rgba(17,22,31,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F16; --surface:#131924; --surface-2:#0F141D;
      --ink:#E7EAF1; --ink-soft:#9AA4B2; --ink-faint:#67707D;
      --line:#26303D; --line-strong:#333F4E;
      --copper:#D89A55; --copper-ink:#F0C48C; --copper-soft:#2A2013; --copper-soft-line:#4A3620;
      --signal:#4FC79A; --signal-soft:#10241C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F16; --surface:#131924; --surface-2:#0F141D;
    --ink:#E7EAF1; --ink-soft:#9AA4B2; --ink-faint:#67707D;
    --line:#26303D; --line-strong:#333F4E;
    --copper:#D89A55; --copper-ink:#F0C48C; --copper-soft:#2A2013; --copper-soft-line:#4A3620;
    --signal:#4FC79A; --signal-soft:#10241C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; }
  .page{ max-width:1180px; margin:0 auto; padding:2.6rem 1.5rem 3.5rem; }

  header.head{ display:flex; flex-direction:column; gap:.6rem; margin-bottom:1.6rem; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--copper); font-weight:600; }
  h1{ margin:0; font-weight:900; letter-spacing:-.01em; font-size:clamp(1.55rem,1.15rem + 1.8vw,2.35rem); text-wrap:balance; }
  .lede{ margin:0; max-width:64ch; color:var(--ink-soft); font-size:1rem; line-height:1.7; min-height:1.7em; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; align-items:center; font-size:.78rem; color:var(--ink-faint); margin-top:.2rem; }
  .meta-row .dot{ display:inline-block; width:7px;height:7px;border-radius:50%; background:var(--copper); margin-right:.45em; vertical-align:middle; }

  /* ---------- industry switcher ---------- */
  .switcher{ display:flex; flex-wrap:wrap; gap:.5rem; margin:1.4rem 0 1.2rem; }
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    letter-spacing:.03em;
    padding:.5rem 1rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover{ border-color:var(--copper); color:var(--copper); }
  .tab:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .tab.active{ background:var(--copper); border-color:var(--copper); color:#fff; }

  /* ---------- company search ---------- */
  .search-wrap{ position:relative; margin:0 0 .3rem; }
  .search-box{ display:flex; align-items:center; gap:.65rem; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.7rem 1rem; box-shadow:var(--shadow); }
  .search-box:focus-within{ border-color:var(--copper); }
  .search-icon{ color:var(--ink-faint); flex-shrink:0; }
  .search-input{ flex:1; min-width:0; border:none; outline:none; background:none; font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; font-size:.92rem; color:var(--ink); }
  .search-input::placeholder{ color:var(--ink-faint); }
  .search-clear{ display:none; border:none; background:var(--surface-2); color:var(--ink-faint); width:22px; height:22px; border-radius:50%; align-items:center; justify-content:center; cursor:pointer; font-size:.78rem; flex-shrink:0; }
  .search-clear.show{ display:flex; }
  .search-clear:hover{ color:var(--ink); }
  .search-results{ position:absolute; top:calc(100% + .5rem); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); max-height:420px; overflow-y:auto; z-index:30; display:none; }
  .search-results.open{ display:block; }
  .search-group{ border-top:1px solid var(--line); }
  .search-group:first-child{ border-top:none; }
  .search-company-name{ display:flex; align-items:center; gap:.5rem; padding:.7rem 1rem .3rem; font-weight:800; font-size:.9rem; color:var(--ink); }
  .search-company-name .tw-dot{ width:6px;height:6px;border-radius:50%; background:var(--copper); flex-shrink:0; }
  .search-company-name .tw-tag{ font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--copper-ink); font-weight:700; letter-spacing:.04em; background:var(--copper-soft); border:1px solid var(--copper-soft-line); border-radius:5px; padding:.05rem .32rem; }
  .search-loc-btn{ display:block; width:100%; text-align:left; padding:.5rem 1rem .5rem 1.55rem; border:none; background:none; cursor:pointer; font-size:.8rem; color:var(--ink-soft); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
  .search-loc-btn:last-child{ padding-bottom:.75rem; }
  .search-loc-btn:hover{ background:var(--surface-2); color:var(--copper-ink); }
  .search-loc-industry{ color:var(--copper-ink); font-weight:700; }
  .search-loc-arrow{ font-family:'IBM Plex Mono',monospace; color:var(--ink-faint); margin:0 .3em; }
  .search-empty, .search-hint{ padding:1rem; color:var(--ink-faint); font-size:.83rem; text-align:center; }
  .search-more{ padding:.55rem 1rem .8rem; color:var(--ink-faint); font-size:.74rem; text-align:center; font-family:'IBM Plex Mono',monospace; }
  .search-section-label{ padding:.6rem 1rem .3rem; font-size:.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.1em; font-family:'IBM Plex Mono',monospace; border-top:1px solid var(--line); }
  .search-section-label:first-child{ border-top:none; }
  .search-topic-btn{ display:block; width:100%; text-align:left; padding:.55rem 1rem; border:none; background:none; cursor:pointer; font-size:.85rem; color:var(--ink-soft); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
  .search-topic-btn:hover{ background:var(--surface-2); color:var(--copper-ink); }
  .search-topic-industry{ font-weight:800; color:var(--ink); }
  .search-topic-kind{ margin-left:.5rem; font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--copper-ink); background:var(--copper-soft); border:1px solid var(--copper-soft-line); border-radius:5px; padding:.05rem .32rem; }

  /* ---------- diagram ---------- */
  .diagram-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:1.1rem 1.1rem .6rem; margin-bottom:1.6rem; }
  .diagram-scroll{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  .flow-svg{ display:block; width:100%; min-width:880px; height:auto; }
  .scroll-hint{ display:none; font-size:.72rem; color:var(--ink-faint); text-align:center; padding:.3rem 0 .1rem; font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; }
  @media (max-width:760px){ .scroll-hint{display:block;} }

  .node-group{cursor:pointer;}
  .node-box{ fill:var(--surface); stroke:var(--line-strong); stroke-width:1.4; transition:stroke .15s ease, fill .15s ease; }
  .node-group:hover .node-box{ stroke:var(--copper); }
  .node-group:focus{ outline:none; }
  .node-group:focus-visible .node-box{ stroke:var(--copper); stroke-width:2.4; }
  .node-group.reached .node-box{ fill:var(--copper-soft); stroke:var(--copper-soft-line); }
  .node-group.active .node-box{ fill:var(--copper-soft); stroke:var(--copper); stroke-width:2.6; }
  .node-icon{ color:var(--ink-soft); }
  .node-group.reached .node-icon{ color:var(--copper-ink); }
  .node-group.active .node-icon{ color:var(--copper-ink); }
  .node-num circle{ fill:var(--surface-2); stroke:var(--line-strong); stroke-width:1.2; }
  .node-num text{ fill:var(--ink-faint); font-weight:600; }
  .node-group.reached .node-num circle, .node-group.active .node-num circle{ fill:var(--copper); stroke:var(--copper); }
  .node-group.reached .node-num text, .node-group.active .node-num text{ fill:#fff; }
  .node-group.parallel .node-box{ stroke-dasharray:6 4; }
  .node-parallel-badge circle{ fill:var(--copper-soft); stroke:var(--copper-soft-line); stroke-width:1.2; }
  .node-parallel-badge text{ fill:var(--copper-ink); font-weight:700; }
  .node-title{ fill:var(--ink); font-weight:700; }
  .node-sub{ fill:var(--ink-faint); letter-spacing:.05em; }
  .segment{ stroke:var(--line-strong); stroke-width:2; fill:none; }
  .segment.passed{ stroke:var(--copper); }
  .segment.segment-parallel{ stroke-dasharray:3 6; opacity:.6; stroke-linecap:round; }
  .segment.segment-parallel.passed{ stroke:var(--copper); opacity:.75; }

  /* ---------- detail panel ---------- */
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:1.8rem; display:grid; grid-template-columns:auto 1fr; gap:1.6rem; }
  @media (max-width:640px){ .panel{grid-template-columns:1fr; padding:1.4rem;} }
  .panel-icon-wrap{ width:64px;height:64px; border-radius:14px; background:var(--copper-soft); border:1px solid var(--copper-soft-line); display:flex;align-items:center;justify-content:center; color:var(--copper-ink); flex-shrink:0; }
  .panel-icon-wrap svg{ width:38px;height:38px; }
  .panel-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
  .panel-step{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; }
  .panel-title{ margin:.15rem 0 0; font-size:1.4rem; font-weight:800; letter-spacing:-.01em; }
  .panel-sub{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--copper); letter-spacing:.08em; margin-top:.15rem; }
  .panel-desc{ margin:.9rem 0 0; color:var(--ink-soft); line-height:1.75; font-size:.95rem; max-width:68ch; }
  .node-diagram{ margin:1.1rem 0 0; padding:1rem 1rem .8rem; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); }
  .node-diagram-svg{ width:100%; }
  .node-diagram-svg svg{ width:100%; height:auto; display:block; }
  .node-diagram figcaption{ margin-top:.6rem; font-size:.78rem; color:var(--ink-faint); line-height:1.6; }
  .cross-link-group{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1rem; }
  .cross-link{ display:inline-flex; align-items:center; gap:.6rem; padding:.65rem 1rem; border-radius:10px; background:var(--copper-soft); border:1px solid var(--copper-soft-line); color:var(--copper-ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; font-weight:700; font-size:.88rem; cursor:pointer; transition:border-color .15s ease, background .15s ease, color .15s ease; }
  .cross-link:hover{ background:var(--copper); border-color:var(--copper); color:#fff; }
  .cross-link:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .cross-link-arrow{ font-family:'IBM Plex Mono',monospace; }
  .parallel-note{ margin-top:.9rem; padding:.75rem .9rem; border-radius:10px; background:var(--surface-2); border:1px dashed var(--line-strong); font-size:.82rem; color:var(--ink-soft); line-height:1.7; }
  .parallel-pills{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem; }
  .parallel-pill{ display:inline-flex; align-items:center; padding:.3rem .65rem; border-radius:999px; background:var(--surface); border:1px solid var(--line); color:var(--copper-ink); font-size:.78rem; font-family:inherit; cursor:pointer; }
  .parallel-pill:hover{ border-color:var(--copper); background:var(--copper-soft); }
  .parallel-pill:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .chip-label{ font-size:.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.1em; font-family:'IBM Plex Mono',monospace; margin:1.2rem 0 .55rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip{ display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .7rem; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:.83rem; color:var(--ink-soft); font-family:inherit; cursor:pointer; transition:border-color .15s ease, background .15s ease, color .15s ease, transform .1s ease; }
  .chip.tw{ background:var(--copper-soft); border:1px solid var(--copper-soft-line); color:var(--ink); font-weight:700; }
  .chip .tw-dot{ width:6px;height:6px;border-radius:50%; background:var(--copper); flex-shrink:0; }
  .chip .tw-tag{ font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--copper-ink); font-weight:700; letter-spacing:.04em; }
  .chip .chip-code{ font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--ink-faint); }
  .chip.tw .chip-code{ color:var(--copper-ink); }
  .chip:hover{ border-color:var(--copper); color:var(--copper-ink); background:var(--copper-soft); transform:translateY(-1px); }
  .chip:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }

  /* ---------- company profile modal ---------- */
  .modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(11,15,22,.55); backdrop-filter:blur(2px); z-index:100; align-items:flex-start; justify-content:center; padding:5vh 1rem; overflow-y:auto; }
  .modal-backdrop.open{ display:flex; }
  .company-modal{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); max-width:640px; width:100%; padding:1.8rem; position:relative; margin-bottom:5vh; }
  .modal-close{ position:absolute; top:1.1rem; right:1.1rem; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); font-size:1rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover{ color:var(--ink); border-color:var(--copper); }
  .modal-close:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .modal-header{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; padding-right:2.2rem; }
  .modal-company-name{ font-size:1.35rem; font-weight:800; letter-spacing:-.01em; color:var(--ink); }
  .modal-code{ font-family:'IBM Plex Mono',monospace; font-size:.85rem; font-weight:700; color:var(--copper-ink); background:var(--copper-soft); border:1px solid var(--copper-soft-line); border-radius:7px; padding:.15rem .55rem; }
  .modal-count{ margin:.4rem 0 0; font-size:.82rem; color:var(--ink-faint); }
  .modal-loc-list{ margin-top:1.1rem; border-top:1px solid var(--line); }
  .modal-loc-item{ display:block; width:100%; text-align:left; padding:.75rem .2rem; border:none; border-bottom:1px solid var(--line); background:none; cursor:pointer; font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; font-size:.87rem; color:var(--ink-soft); }
  .modal-loc-item:hover{ color:var(--copper-ink); }
  .modal-loc-industry{ color:var(--copper-ink); font-weight:700; }
  .modal-loc-arrow{ font-family:'IBM Plex Mono',monospace; color:var(--ink-faint); margin:0 .3em; }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.8rem; margin-top:1.2rem; }
  .stat-tile{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:.75rem .9rem; }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-weight:600; font-size:1.25rem; color:var(--signal); }
  .stat-label{ font-size:.74rem; color:var(--ink-faint); margin-top:.15rem; line-height:1.4; }
  .breadcrumb{ display:inline-flex; align-items:center; background:none; border:none; padding:0; margin:0 0 .9rem; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--copper); cursor:pointer; }
  .breadcrumb:hover{ text-decoration:underline; }
  .breadcrumb:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .sub-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.6rem; margin-top:.9rem; }
  .sub-card{ display:flex; flex-direction:column; align-items:flex-start; gap:.5rem; padding:.75rem .8rem; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); transition:border-color .15s ease, background .15s ease; }
  .sub-card:hover{ border-color:var(--copper); background:var(--copper-soft); }
  .sub-card:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .sub-card svg{ width:26px;height:26px; color:var(--copper-ink); }
  .sub-card-title{ font-size:.82rem; font-weight:700; line-height:1.3; }
  .panel-nav{ display:flex; justify-content:space-between; margin-top:1.5rem; padding-top:1.1rem; border-top:1px solid var(--line); grid-column:1 / -1; }
  .nav-btn{ font-family:'IBM Plex Mono',monospace; font-size:.78rem; letter-spacing:.04em; background:none; border:1px solid var(--line); border-radius:8px; padding:.5rem .9rem; color:var(--ink); cursor:pointer; transition:border-color .15s ease, color .15s ease; }
  .nav-btn:hover{ border-color:var(--copper); color:var(--copper); }
  .nav-btn:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .nav-btn[disabled]{ opacity:.35; cursor:default; }
  .nav-btn[disabled]:hover{ border-color:var(--line); color:var(--ink); }

  footer{ margin-top:2.2rem; padding-top:1.4rem; border-top:1px solid var(--line); }
  .sources-label{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:.5rem; }
  .sources-list{ margin:0 0 1rem; padding:0; list-style:none; display:flex; flex-direction:column; gap:.3rem; }
  .sources-list li{ font-size:.78rem; color:var(--ink-soft); }
  .disclaimer{ font-size:.74rem; color:var(--ink-faint); line-height:1.6; max-width:78ch; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>


<div class="page">

  <header class="head">
    <div class="eyebrow">TW &amp; GLOBAL · INDUSTRY SUPPLY CHAIN MAP</div>
    <h1>產業供應鏈全流程地圖</h1>
    <p class="lede" id="lede"></p>
    <div class="meta-row" id="metaRow"></div>
  </header>

  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="companySearchInput" placeholder="搜尋公司名稱、股票代號或關鍵字，例如：台積電、2330、封測…" autocomplete="off" aria-label="搜尋公司名稱、股票代號或產業關鍵字">
      <button class="search-clear" id="searchClearBtn" type="button" aria-label="清除搜尋">✕</button>
    </div>
    <div class="search-results" id="searchResults" role="listbox"></div>
  </div>

  <nav class="switcher" id="switcher" aria-label="選擇產業"></nav>

  <div class="diagram-card">
    <div class="diagram-scroll">
      <svg class="flow-svg" id="flowSvg" viewBox="0 0 1400 460" role="img" aria-label="產業供應鏈流程圖">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>

          <symbol id="icon-wafer" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="14" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <line x1="11" y1="30" x2="18" y2="25" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="20" cy="19" r="1.8" fill="currentColor"/>
            <circle cx="15" cy="15" r="1.3" fill="currentColor"/>
            <circle cx="25" cy="23" r="1.3" fill="currentColor"/>
          </symbol>
          <symbol id="icon-chip" viewBox="0 0 40 40">
            <rect x="12" y="12" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/>
            <rect x="16.5" y="16.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <line x1="17" y1="8" x2="17" y2="12" stroke="currentColor" stroke-width="1.6"/>
            <line x1="23" y1="8" x2="23" y2="12" stroke="currentColor" stroke-width="1.6"/>

  var INDUSTRY_ORDER = Object.keys(INDUSTRIES);

  /* ============================================================
     繪圖／互動引擎　RENDER ENGINE — 通用，不需因新增產業而修改
     ============================================================ */
  var NS = "http://www.w3.org/2000/svg";
  var BOX_W = 220, BOX_H = 130, COL_GAP = 40, MARGIN = 70, ROW_GAP = 170, ROW_SIZE = 5;
  var TOP_Y = 30;

  function colFor(posInRow, rowIsEven){ return rowIsEven ? posInRow : (ROW_SIZE-1-posInRow); }

  function layout(n){
    var pos = [];
    for(var i=0;i<n;i++){
      var row = Math.floor(i/ROW_SIZE);
      var posInRow = i % ROW_SIZE;
      var col = colFor(posInRow, row%2===0);
      pos.push({ x: MARGIN + col*(BOX_W+COL_GAP), y: TOP_Y + row*ROW_GAP });
    }
    var rows = Math.ceil(n/ROW_SIZE);
    var viewH = TOP_Y + rows*BOX_H + (rows-1)*(ROW_GAP-BOX_H) + 30;
    return { pos:pos, viewH:viewH };
  }

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for(var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  var _measureCtx = document.createElement("canvas").getContext("2d");
  function textWidth(str, fontSize){
    _measureCtx.font = "700 " + fontSize + "px 'Noto Sans TC', sans-serif";
    return _measureCtx.measureText(str).width;
  }
  function splitTitle(str, maxWidth){
    var fs = 15.5;
    if (textWidth(str, fs) <= maxWidth) return { lines:[str], fs:fs };
    for (; fs >= 12; fs -= 1){
      var best = null, bestScore = Infinity;
      for (var i=1;i<str.length;i++){
        var left = str.slice(0,i), right = str.slice(i);
        var lw = textWidth(left, fs), rw = textWidth(right, fs);
        if (lw<=maxWidth && rw<=maxWidth){
          var bonus = /[（(／\/、，,\-）)]/.test(str[i-1]) ? -20 : 0;
          var score = Math.abs(lw-rw) + bonus;
          if (score < bestScore){ bestScore = score; best = i; }
        }
      }
      if (best!==null) return { lines:[str.slice(0,best), str.slice(best)], fs:fs };
    }
    var mid = Math.ceil(str.length/2);
    return { lines:[str.slice(0,mid), str.slice(mid)], fs:12 };
  }
  // 節點框內的英文小標（node.sub）也需要依寬度自動縮小字級／必要時省略，
  // 避免長英文標籤（如 METALLURGICAL-GRADE SILICON）超出卡片邊框。
  function fitSubText(str, maxWidth){
    if(!str) return { text:"", fs:9 };
    var fs = 9;
    _measureCtx.font = fs + "px 'IBM Plex Mono', monospace";
    if (_measureCtx.measureText(str).width <= maxWidth) return { text:str, fs:fs };
    for (; fs >= 6.5; fs -= 0.5){
      _measureCtx.font = fs + "px 'IBM Plex Mono', monospace";
      if (_measureCtx.measureText(str).width <= maxWidth) return { text:str, fs:fs };
    }
    _measureCtx.font = "6.5px 'IBM Plex Mono', monospace";
    var t = str;
    while(t.length > 1 && _measureCtx.measureText(t+"…").width > maxWidth){ t = t.slice(0,-1); }
    return { text:t+"…", fs:6.5 };
  }

  var svg = document.getElementById("flowSvg");
  var segLayer = document.getElementById("segmentsLayer");
  var nodeLayer = document.getElementById("nodesLayer");
  var panel = document.getElementById("panel");
  var switcherEl = document.getElementById("switcher");
  var ledeEl = document.getElementById("lede");
  var metaEl = document.getElementById("metaRow");
  var sourcesEl = document.getElementById("sourcesList");
  var disclaimerEl = document.getElementById("disclaimer");

  var state = { industry:null, nodeEls:{}, segEls:[], nodes:[], current:0 };

  function renderSwitcher(){
    switcherEl.innerHTML = "";
    if(INDUSTRY_ORDER.length < 2){ switcherEl.style.display = "none"; return; }
    switcherEl.style.display = "flex";
    INDUSTRY_ORDER.forEach(function(key){

      btn.className = "tab" + (key===state.industry ? " active" : "");

      switcherEl.appendChild(btn);

  function renderMeta(ind){
    ledeEl.textContent = ind.lede;
    metaEl.innerHTML = '<span>資料彙整：'+ind.updated+'</span><span><span class="dot"></span>節點反白＝台灣供應鏈廠商佔重要地位</span>';
    sourcesEl.innerHTML = ind.sources.map(function(s){ return "<li>"+s+"</li>"; }).join("");
    disclaimerEl.textContent = ind.disclaimer;
  }

  function buildDiagram(ind){
    segLayer.innerHTML = "";
    nodeLayer.innerHTML = "";
    state.nodeEls = {};
    state.segEls = [];
    state.nodes = ind.nodes;

    var L = layout(ind.nodes.length);
    svg.setAttribute("viewBox", "0 0 1400 " + L.viewH);

    for(var i=0;i<ind.nodes.length-1;i++){
      var a = L.pos[i], b = L.pos[i+1];
      var path;
      if(a.y !== b.y){
        var x = a.x + BOX_W/2;
        path = "M"+x+","+(a.y+BOX_H)+" L"+x+","+b.y;
      } else {
        var y = a.y + BOX_H/2;
        var x1, x2;
        if(b.x > a.x){ x1=a.x+BOX_W; x2=b.x; } else { x1=a.x; x2=b.x+BOX_W; }
        path = "M"+x1+","+y+" L"+x2+","+y;
      }
      // 平行環節（同一 parallelGroup）之間不畫方向箭頭，改用中性虛線表示「並列、無固定順序」
      var isParallel = ind.nodes[i].parallelGroup && ind.nodes[i].parallelGroup === ind.nodes[i+1].parallelGroup;
      var segAttrs = {class:"segment"+(isParallel?" segment-parallel":""), d:path};
      if(!isParallel) segAttrs["marker-end"] = "url(#arrow)";
      var line = el("path", segAttrs);
      segLayer.appendChild(line);
      state.segEls.push(line);
    }

    ind.nodes.forEach(function(node, i){
      var p = L.pos[i];
      var isParallelNode = !!node.parallelGroup;
      var g = el("g", {class:"node-group"+(isParallelNode?" parallel":""), tabindex:"0", role:"button", "aria-pressed":"false",
        "aria-label":(isParallelNode?"平行環節：":"第"+(i+1)+"步：")+node.title});
      g.appendChild(el("rect", {class:"node-box", x:p.x, y:p.y, width:BOX_W, height:BOX_H, rx:14}));
      if(isParallelNode){
        var pTitle = el("title", {});
        pTitle.textContent = "平行環節，與同組其他環節無固定先後順序";
        g.appendChild(pTitle);
      }

      var iconSize = 34, iconX = p.x+BOX_W/2-iconSize/2, iconY = p.y+14;
      var use = el("use", {href:"#"+(node.icon||"icon-generic"), x:iconX, y:iconY, width:iconSize, height:iconSize});
      use.setAttribute("class","node-icon");
      g.appendChild(use);

      var wrapped = splitTitle(node.title, BOX_W-30);
      var twoLine = wrapped.lines.length > 1;
      var titleY = twoLine ? p.y+58 : p.y+72;
      var title = el("text", {class:"node-title", x:p.x+BOX_W/2, y:titleY, "text-anchor":"middle", "font-size":String(wrapped.fs)});
      wrapped.lines.forEach(function(line, li){
        var tspan = el("tspan", {x:p.x+BOX_W/2, dy: li===0 ? 0 : (wrapped.fs+4)});
        tspan.textContent = line;
        title.appendChild(tspan);
      });
      g.appendChild(title);

      var subY = twoLine ? (titleY + (wrapped.fs+4) + 20) : p.y+94;
      var subFit = fitSubText(node.sub, BOX_W-30);
      var sub = el("text", {class:"node-sub mono", x:p.x+BOX_W/2, y:subY, "text-anchor":"middle", "font-size":String(subFit.fs)});
      sub.textContent = subFit.text;
      g.appendChild(sub);

      var numG = el("g", {class:"node-num"});
      numG.appendChild(el("circle", {cx:p.x+BOX_W-18, cy:p.y+18, r:12}));
      var numText = el("text", {x:p.x+BOX_W-18, y:p.y+22, "text-anchor":"middle", "font-size":"11", class:"mono"});
      numText.textContent = String(i+1).padStart(2,"0");
      numG.appendChild(numText);
      g.appendChild(numG);

      if(isParallelNode){
        var badgeG = el("g", {class:"node-parallel-badge"});
        badgeG.appendChild(el("circle", {cx:p.x+18, cy:p.y+18, r:12}));
        var badgeText = el("text", {x:p.x+18, y:p.y+22, "text-anchor":"middle", "font-size":"13"});
        badgeText.textContent = "⇄";
        badgeG.appendChild(badgeText);
        g.appendChild(badgeG);
      }

      g.addEventListener("click", function(idx){ return function(){ selectNode(idx); }; }(i));
      g.addEventListener("keydown", function(idx){ return function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); selectNode(idx); }
      }; }(i));

      nodeLayer.appendChild(g);
      state.nodeEls[i] = g;
    });
  }

  function chipsHtmlFor(companies){
    return (companies||[]).map(function(c){
      return '<button type="button" class="chip'+(c.tw?' tw':'')+'" data-company="'+escapeHtml(c.n)+'">' + (c.tw ? '<span class="tw-dot"></span><span class="tw-tag">TW</span>' : '') +
             '<span>'+c.n+'</span>' + (c.code ? '<span class="chip-code mono">'+c.code+'</span>' : '') + '</button>';
    }).join("");
  }
  function wireChipClicks(container){
    Array.prototype.forEach.call(container.querySelectorAll(".chip[data-company]"), function(btn){
      btn.addEventListener("click", function(){
        openCompanyModal(btn.getAttribute("data-company"));
      });
    });
  }
  function statsHtmlFor(stats){
    return (stats||[]).map(function(s){
      return '<div class="stat-tile"><div class="stat-value mono">'+s.v+'</div><div class="stat-label">'+s.l+'</div></div>';
    }).join("");
  }
  /* 結構示意圖：node.diagram 對應 DIAGRAMS 裡的 key，node.diagramCaption 為圖說文字 */
  function diagramHtmlFor(node){
    if(!node.diagram || !DIAGRAMS[node.diagram]) return "";
    return '<figure class="node-diagram"><div class="node-diagram-svg">'+DIAGRAMS[node.diagram]+'</div>' +
      (node.diagramCaption ? '<figcaption>'+node.diagramCaption+'</figcaption>' : '') +
      '</figure>';
  }

  /* 自動相關產業比對：只要節點的 tags 與其他產業 meta.tags 有交集，
     就會自動出現跳轉按鈕——之後新增產業只要標好 tags，既有節點會自動連過去，
     不需要每次手動加 crossLink。 */
  function relatedIndustriesFor(node){
    if(!node.tags || !node.tags.length) return [];
    var matches = [];
    INDUSTRY_ORDER.forEach(function(key){
      if(key === state.industry) return;
      var indTags = INDUSTRIES[key].tags || [];
      var hit = node.tags.some(function(t){ return indTags.indexOf(t) !== -1; });
      if(hit) matches.push({ key:key, name: INDUSTRIES[key].name });
    });
    return matches;
  }

  function renderPanel(i){
    var node = state.nodes[i];
    var subGridHtml = "";
    if(node.children && node.children.length){
      subGridHtml = '<div class="chip-label">深入了解：細分環節</div><div class="sub-grid">' +
        node.children.map(function(child, ci){
          return '<button class="sub-card" data-child="'+ci+'">' +
            '<svg viewBox="0 0 40 40"><use href="#'+(child.icon||"icon-generic")+'"></use></svg>' +
            '<span class="sub-card-title">'+child.title+'</span>' +
          '</button>';
        }).join("") + '</div>';
    }
    var related = relatedIndustriesFor(node);
    var crossLinkHtml = "";
    if(related.length){
      crossLinkHtml = '<div class="cross-link-group">' +
        related.map(function(m){
          return '<button class="cross-link" data-target="'+m.key+'">' +
            '<span>查看「'+m.name+'」完整內容</span><span class="cross-link-arrow">→</span>' +
          '</button>';
        }).join("") + '</div>';
    }

    var parallelHtml = "";
    if(node.parallelGroup){
      var siblings = [];
      state.nodes.forEach(function(n, idx){
        if(idx !== i && n.parallelGroup === node.parallelGroup) siblings.push({ idx:idx, title:n.title });
      });
      if(siblings.length){
        parallelHtml = '<div class="parallel-note">⇄ 平行環節，與下列 '+siblings.length+' 個環節同時並存、無固定先後順序：<div class="parallel-pills">' +
          siblings.map(function(s){
            return '<button class="parallel-pill" data-idx="'+s.idx+'">'+s.title+'</button>';
          }).join("") + '</div></div>';
      }
    }

    panel.innerHTML =
      '<div class="panel-icon-wrap"><svg viewBox="0 0 40 40"><use href="#'+(node.icon||"icon-generic")+'"></use></svg></div>' +
      '<div class="panel-body">' +
        '<div class="panel-top"><div>' +
          '<div class="panel-step">STEP '+String(i+1).padStart(2,"0")+' / '+state.nodes.length+'</div>' +
          '<h2 class="panel-title">'+node.title+'</h2>' +
          '<div class="panel-sub">'+(node.sub||"")+'</div>' +
        '</div></div>' +
        '<p class="panel-desc">'+node.desc+'</p>' +
        diagramHtmlFor(node) +
        parallelHtml +
        crossLinkHtml +
        '<div class="chip-label">代表廠商</div>' +
        '<div class="chips">'+chipsHtmlFor(node.companies)+'</div>' +
        '<div class="stats">'+statsHtmlFor(node.stats)+'</div>' +
        subGridHtml +
        '<div class="panel-nav">' +
          '<button class="nav-btn" id="prevBtn" '+(i===0?"disabled":"")+'>‹ 上一步</button>' +
          '<button class="nav-btn" id="nextBtn" '+(i===state.nodes.length-1?"disabled":"")+'>下一步 ›</button>' +
        '</div>' +
      '</div>';

    document.getElementById("prevBtn").addEventListener("click", function(){ if(i>0) selectNode(i-1); });
    document.getElementById("nextBtn").addEventListener("click", function(){ if(i<state.nodes.length-1) selectNode(i+1); });
    wireChipClicks(panel);

    if(node.children && node.children.length){
      Array.prototype.forEach.call(panel.querySelectorAll(".sub-card"), function(btn){
        btn.addEventListener("click", function(){
          renderChildPanel(i, parseInt(btn.getAttribute("data-child"), 10));
        });
      });

    if(related.length){
      Array.prototype.forEach.call(panel.querySelectorAll(".cross-link"), function(btn){
        btn.addEventListener("click", function(){
          selectIndustry(btn.getAttribute("data-target"), node.tags);

    if(node.parallelGroup){
      Array.prototype.forEach.call(panel.querySelectorAll(".parallel-pill"), function(btn){

  function renderChildPanel(parentIndex, childIndex){
    var parent = state.nodes[parentIndex];
    var child = parent.children[childIndex];

    panel.innerHTML =
      '<div class="panel-icon-wrap"><svg viewBox="0 0 40 40"><use href="#'+(child.icon||"icon-generic")+'"></use></svg></div>' +
      '<div class="panel-body">' +
        '<button class="breadcrumb" id="backBtn">‹ 返回「'+parent.title+'」</button>' +

        diagramHtmlFor(child) +
        '<div class="chip-label">代表廠商</div>' +

        '<div class="stats">'+statsHtmlFor(child.stats)+'</div>' +

          '<button class="nav-btn" id="childNext" '+(childIndex===parent.children.length-1?"disabled":"")+'>下一類 ›</button>' +
        '</div>' +
      '</div>';

    document.getElementById("backBtn").addEventListener("click", function(){ renderPanel(parentIndex); });
    document.getElementById("childPrev").addEventListener("click", function(){ if(childIndex>0) renderChildPanel(parentIndex, childIndex-1); });
    document.getElementById("childNext").addEventListener("click", function(){ if(childIndex<parent.children.length-1) renderChildPanel(parentIndex, childIndex+1); });
    wireChipClicks(panel);
  }

  function selectNode(i){
    state.current = i;
    state.nodes.forEach(function(_, idx){
      var g = state.nodeEls[idx];
      g.classList.remove("active","reached");
      g.setAttribute("aria-pressed", idx===i ? "true":"false");
      if(idx < i) g.classList.add("reached");
      if(idx === i) g.classList.add("active");
    });
    state.segEls.forEach(function(seg, idx){
      if(idx < i) seg.classList.add("passed"); else seg.classList.remove("passed");
    });
    renderPanel(i);
  }

  function selectIndustry(key, preferTags){
    state.industry = key;
    var ind = INDUSTRIES[key];
    renderSwitcher();
    renderMeta(ind);
    buildDiagram(ind);
    var targetIdx = 0;
    if(preferTags && preferTags.length){
      for(var i=0;i<state.nodes.length;i++){
        var nt = state.nodes[i].tags || [];
        if(nt.some(function(t){ return preferTags.indexOf(t) !== -1; })){ targetIdx = i; break; }
      }
    }
    selectNode(targetIdx);
  }

  /* ============================================================
     公司搜尋 — 掃描所有產業的節點與細分環節，建立「公司→位置」索引
     ============================================================ */
  var companyIndex = null;
  var topicIndex = null;

  /* 產業／環節關鍵字索引：讓輸入「封測」等主題詞也能直接找到對應產業頁籤
     或節點（例如「委外封測服務商」），與公司名稱搜尋並列顯示。 */
  function buildTopicIndex(){
    var items = [];
    INDUSTRY_ORDER.forEach(function(key){
      var ind = INDUSTRIES[key];
      items.push({ kind:"industry", industryKey:key, industryName:ind.name, title:ind.name, nodeIndex:null, childIndex:null, parentTitle:null });
      (ind.nodes||[]).forEach(function(node, ni){
        items.push({ kind:"node", industryKey:key, industryName:ind.name, title:node.title, nodeIndex:ni, childIndex:null, parentTitle:null });
        (node.children||[]).forEach(function(child, ci){
          items.push({ kind:"child", industryKey:key, industryName:ind.name, title:child.title, nodeIndex:ni, childIndex:ci, parentTitle:node.title });
        });
      });
    });
    return items;
  }

  function searchTopics(query){
    var q = query.trim().toLowerCase();
    if(!q) return [];
    var kindRank = { industry:0, node:1, child:2 };
    var results = [];
    topicIndex.forEach(function(item){
      var idx = item.title.toLowerCase().indexOf(q);
      if(idx !== -1) results.push({ item:item, rank:idx, kr:kindRank[item.kind] });
    });
    results.sort(function(a, b){
      if(a.rank !== b.rank) return a.rank - b.rank;
      if(a.kr !== b.kr) return a.kr - b.kr;
      return a.item.title.length - b.item.title.length;
    });
    return results.map(function(r){ return r.item; });
  }

  function buildCompanyIndex(){
    var map = {};
    INDUSTRY_ORDER.forEach(function(key){
      var ind = INDUSTRIES[key];
      (ind.nodes||[]).forEach(function(node, ni){
        (node.companies||[]).forEach(function(c){
          addCompanyHit(map, c, { industryKey:key, industryName:ind.name, nodeIndex:ni, nodeTitle:node.title, childIndex:null, childTitle:null });
        });
        (node.children||[]).forEach(function(child, ci){
          (child.companies||[]).forEach(function(c){
            addCompanyHit(map, c, { industryKey:key, industryName:ind.name, nodeIndex:ni, nodeTitle:node.title, childIndex:ci, childTitle:child.title });
          });
        });
      });
    });
    return map;
  }

  function addCompanyHit(map, c, loc){
    var name = c.n;
    if(!name) return;
    if(!map[name]) map[name] = { name:name, tw: !!c.tw, code: c.code||null, locs: [] };
    if(c.tw) map[name].tw = true;
    if(c.code) map[name].code = c.code;
    var dup = map[name].locs.some(function(l){
      return l.industryKey===loc.industryKey && l.nodeIndex===loc.nodeIndex && l.childIndex===loc.childIndex;
    });
    if(!dup) map[name].locs.push(loc);
  }

  function searchCompanies(query){
    var q = query.trim().toLowerCase();
    if(!q) return [];
    var results = [];
    for(var name in companyIndex){
      var entry = companyIndex[name];
      var nameIdx = name.toLowerCase().indexOf(q);
      var codeIdx = entry.code ? entry.code.toLowerCase().indexOf(q) : -1;
      // 股票代號完全比對優先（rank -1 排在最前面），其餘依名稱/代號出現位置排序
      if(codeIdx === 0 && entry.code.length === q.length){
        results.push({ entry: entry, rank: -1 });
      } else if(nameIdx !== -1){
        results.push({ entry: entry, rank: nameIdx });
      } else if(codeIdx !== -1){
        results.push({ entry: entry, rank: codeIdx + 0.5 });
      }
    }
    results.sort(function(a, b){
      if(a.rank !== b.rank) return a.rank - b.rank;
      return a.entry.name.length - b.entry.name.length;
    });
    return results.map(function(r){ return r.entry; });
  }

  var MAX_SEARCH_RESULTS = 24;
  var MAX_TOPIC_RESULTS = 8;

  function renderSearchResults(query){
    var resultsEl = document.getElementById("searchResults");
    if(!query.trim()){
      resultsEl.classList.remove("open");
      resultsEl.innerHTML = "";
      return;
    }
    var companyMatches = searchCompanies(query);
    var topicMatches = searchTopics(query);
    if(!companyMatches.length && !topicMatches.length){
      resultsEl.innerHTML = '<div class="search-empty">找不到符合「'+escapeHtml(query.trim())+'」的公司或產業環節，換個關鍵字試試？</div>';
      resultsEl.classList.add("open");
      return;
    }

    var html = "";

    if(topicMatches.length){
      var shownTopics = topicMatches.slice(0, MAX_TOPIC_RESULTS);
      html += '<div class="search-section-label">產業／環節</div>' +
        shownTopics.map(function(item, ti){
          var label;
          if(item.kind === "industry"){
            label = '<span class="search-topic-industry">'+escapeHtml(item.title)+'</span><span class="search-topic-kind">產業頁籤</span>';
          } else if(item.kind === "node"){
            label = escapeHtml(item.industryName) + '<span class="search-loc-arrow">›</span>' + escapeHtml(item.title);
          } else {
            label = escapeHtml(item.industryName) + '<span class="search-loc-arrow">›</span>' + escapeHtml(item.parentTitle) +
              '<span class="search-loc-arrow">›</span>' + escapeHtml(item.title);
          }
          return '<button class="search-topic-btn" data-topic="'+ti+'">'+label+'</button>';
        }).join("");
      if(topicMatches.length > shownTopics.length){
        html += '<div class="search-more">還有 '+(topicMatches.length - shownTopics.length)+' 個符合的環節，請輸入更精確的關鍵字</div>';
      }
    }

    if(companyMatches.length){
      var shown = companyMatches.slice(0, MAX_SEARCH_RESULTS);
      if(topicMatches.length) html += '<div class="search-section-label">公司</div>';
      html += shown.map(function(entry){
        var badge = entry.tw ? '<span class="tw-dot"></span><span class="tw-tag">TW</span>' : "";
        var codeBadge = entry.code ? '<span class="tw-tag mono">'+entry.code+'</span>' : "";
        var locsHtml = entry.locs.map(function(loc, li){
          var label = loc.industryName + '<span class="search-loc-arrow">›</span>' + loc.nodeTitle +
            (loc.childTitle ? '<span class="search-loc-arrow">›</span>' + loc.childTitle : "");
          return '<button class="search-loc-btn" data-name="'+escapeHtml(entry.name)+'" data-loc="'+li+'">'+label+'</button>';
        }).join("");
        return '<div class="search-group">' +
          '<div class="search-company-name">'+badge+'<span>'+escapeHtml(entry.name)+'</span>'+codeBadge+'</div>' +
          locsHtml +
        '</div>';
      }).join("");
      if(companyMatches.length > shown.length){
        html += '<div class="search-more">還有 '+(companyMatches.length - shown.length)+' 家符合的公司，請輸入更精確的關鍵字</div>';
      }
    }

    resultsEl.innerHTML = html;
    resultsEl.classList.add("open");

    if(topicMatches.length){
      var shownTopicsForClick = topicMatches.slice(0, MAX_TOPIC_RESULTS);
      Array.prototype.forEach.call(resultsEl.querySelectorAll(".search-topic-btn"), function(btn){
        btn.addEventListener("click", function(){
          var item = shownTopicsForClick[parseInt(btn.getAttribute("data-topic"), 10)];
          if(item.kind === "industry"){
            goToIndustryOverview(item.industryKey);
          } else {
            goToSearchLocation({ industryKey:item.industryKey, nodeIndex:item.nodeIndex, childIndex:item.childIndex });
          }
        });
      });
    }

    Array.prototype.forEach.call(resultsEl.querySelectorAll(".search-loc-btn"), function(btn){
      btn.addEventListener("click", function(){
        var entry = companyIndex[btn.getAttribute("data-name")];
        var loc = entry.locs[parseInt(btn.getAttribute("data-loc"), 10)];
        goToSearchLocation(loc);
      });
    });
  }

  function goToSearchLocation(loc){
    selectIndustry(loc.industryKey);
    selectNode(loc.nodeIndex);
    if(loc.childIndex !== null){
      renderChildPanel(loc.nodeIndex, loc.childIndex);
    }
    document.getElementById("searchResults").classList.remove("open");
    setTimeout(function(){
      panel.scrollIntoView({ behavior:"smooth", block:"start" });
    }, 30);
  }

  function goToIndustryOverview(key){
    selectIndustry(key);
    document.getElementById("searchResults").classList.remove("open");
    setTimeout(function(){
      document.getElementById("switcher").scrollIntoView({ behavior:"smooth", block:"start" });
    }, 30);
  }

  /* ============================================================
     公司檔案彈窗 — 點擊「代表廠商」標籤，顯示該公司在全站所有
     產業／環節的完整清單
     ============================================================ */
  function openCompanyModal(name){
    var entry = companyIndex[name];
    var backdrop = document.getElementById("companyModalBackdrop");
    var nameEl = document.getElementById("modalCompanyName");
    var codeEl = document.getElementById("modalCompanyCode");
    var countEl = document.getElementById("modalCompanyCount");
    var listEl = document.getElementById("modalLocList");

    if(!entry){
      // 極少數情況：companies 陣列裡有 tw 以外未被索引到的名稱，仍給基本畫面
      entry = { name:name, tw:false, code:null, locs:[] };
    }

    nameEl.textContent = entry.name;
    if(entry.code){
      codeEl.textContent = entry.code;
      codeEl.hidden = false;
    } else {
      codeEl.hidden = true;
    }
    countEl.textContent = entry.locs.length
      ? '出現在 '+entry.locs.length+' 個供應鏈位置'
      : '目前資料庫中查無此公司的詳細環節資料';

    listEl.innerHTML = entry.locs.map(function(loc, li){
      var label = '<span class="modal-loc-industry">'+loc.industryName+'</span><span class="modal-loc-arrow">›</span>' + loc.nodeTitle +
        (loc.childTitle ? '<span class="modal-loc-arrow">›</span>' + loc.childTitle : "");
      return '<button type="button" class="modal-loc-item" data-loc="'+li+'">'+label+'</button>';
    }).join("");

    Array.prototype.forEach.call(listEl.querySelectorAll(".modal-loc-item"), function(btn){
      btn.addEventListener("click", function(){
        var loc = entry.locs[parseInt(btn.getAttribute("data-loc"), 10)];
        closeCompanyModal();
        goToSearchLocation(loc);
      });
    });

    backdrop.classList.add("open");
    document.getElementById("modalCloseBtn").focus();
  }

  function closeCompanyModal(){
    document.getElementById("companyModalBackdrop").classList.remove("open");
  }

  function initCompanyModal(){
    var backdrop = document.getElementById("companyModalBackdrop");
    document.getElementById("modalCloseBtn").addEventListener("click", closeCompanyModal);
    backdrop.addEventListener("click", function(e){
      if(e.target === backdrop) closeCompanyModal();
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && backdrop.classList.contains("open")) closeCompanyModal();
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function initCompanySearch(){
    companyIndex = buildCompanyIndex();
    topicIndex = buildTopicIndex();
    var input = document.getElementById("companySearchInput");
    var clearBtn = document.getElementById("searchClearBtn");
    var wrap = document.getElementById("searchWrap");
    var resultsEl = document.getElementById("searchResults");

    input.addEventListener("input", function(){
      clearBtn.classList.toggle("show", input.value.length > 0);
      renderSearchResults(input.value);
    });
    input.addEventListener("focus", function(){
      if(input.value.trim()) renderSearchResults(input.value);
    });
    input.addEventListener("keydown", function(e){
      if(e.key === "Escape"){ input.value = ""; clearBtn.classList.remove("show"); resultsEl.classList.remove("open"); input.blur(); }
      if(e.key === "Enter"){
        var first = resultsEl.querySelector(".search-loc-btn");
        if(first){ e.preventDefault(); first.click(); }
      }
    });
    clearBtn.addEventListener("click", function(){
      input.value = "";
      clearBtn.classList.remove("show");
      resultsEl.classList.remove("open");
      input.focus();
    });
    document.addEventListener("click", function(e){
      if(!wrap.contains(e.target)) resultsEl.classList.remove("open");
    });
  }

  selectIndustry(INDUSTRY_ORDER[0]);
  initCompanySearch();
  initCompanyModal();
})();
</script>
