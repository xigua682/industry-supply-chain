<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>產業供應鏈地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#EDF0F5;
    --surface:#FFFFFF;
    --surface-2:#F4F6F9;
    --ink:#11161F;
    --ink-soft:#4B5563;
    --ink-faint:#8792A0;
    --line:#D7DCE3;
    --line-strong:#B9C1CC;
    --copper:#B5702A;
    --copper-ink:#8A5620;
    --copper-soft:#F1E4D3;
    --copper-soft-line:#E0C7A4;
    --signal:#1F8F6E;
    --signal-soft:#DCEFE8;
    --shadow: 0 1px 2px rgba(17,22,31,.04), 0 8px 24px -12px rgba(17,22,31,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F16; --surface:#131924; --surface-2:#0F141D;
      --ink:#E7EAF1; --ink-soft:#9AA4B2; --ink-faint:#67707D;
      --line:#26303D; --line-strong:#333F4E;
      --copper:#D89A55; --copper-ink:#F0C48C; --copper-soft:#2A2013; --copper-soft-line:#4A3620;
      --signal:#4FC79A; --signal-soft:#10241C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F16; --surface:#131924; --surface-2:#0F141D;
    --ink:#E7EAF1; --ink-soft:#9AA4B2; --ink-faint:#67707D;
    --line:#26303D; --line-strong:#333F4E;
    --copper:#D89A55; --copper-ink:#F0C48C; --copper-soft:#2A2013; --copper-soft-line:#4A3620;
    --signal:#4FC79A; --signal-soft:#10241C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; }
  .page{ max-width:1180px; margin:0 auto; padding:2.6rem 1.5rem 3.5rem; }

  header.head{ display:flex; flex-direction:column; gap:.6rem; margin-bottom:1.6rem; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--copper); font-weight:600; }
  h1{ margin:0; font-weight:900; letter-spacing:-.01em; font-size:clamp(1.55rem,1.15rem + 1.8vw,2.35rem); text-wrap:balance; }
  .lede{ margin:0; max-width:64ch; color:var(--ink-soft); font-size:1rem; line-height:1.7; min-height:1.7em; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; align-items:center; font-size:.78rem; color:var(--ink-faint); margin-top:.2rem; }
  .meta-row .dot{ display:inline-block; width:7px;height:7px;border-radius:50%; background:var(--copper); margin-right:.45em; vertical-align:middle; }

  /* ---------- industry switcher ---------- */
  .switcher{ display:flex; flex-wrap:wrap; gap:.5rem; margin:1.4rem 0 1.2rem; }
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    letter-spacing:.03em;
    padding:.5rem 1rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tab:hover{ border-color:var(--copper); color:var(--copper); }
  .tab:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .tab.active{ background:var(--copper); border-color:var(--copper); color:#fff; }

  /* ---------- diagram ---------- */
  .diagram-card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:1.1rem 1.1rem .6rem; margin-bottom:1.6rem; }
  .diagram-scroll{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  .flow-svg{ display:block; width:100%; min-width:880px; height:auto; }
  .scroll-hint{ display:none; font-size:.72rem; color:var(--ink-faint); text-align:center; padding:.3rem 0 .1rem; font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; }
  @media (max-width:760px){ .scroll-hint{display:block;} }

  .node-group{cursor:pointer;}
  .node-box{ fill:var(--surface); stroke:var(--line-strong); stroke-width:1.4; transition:stroke .15s ease, fill .15s ease; }
  .node-group:hover .node-box{ stroke:var(--copper); }
  .node-group:focus{ outline:none; }
  .node-group:focus-visible .node-box{ stroke:var(--copper); stroke-width:2.4; }
  .node-group.reached .node-box{ fill:var(--copper-soft); stroke:var(--copper-soft-line); }
  .node-group.active .node-box{ fill:var(--copper-soft); stroke:var(--copper); stroke-width:2.6; }
  .node-icon{ color:var(--ink-soft); }
  .node-group.reached .node-icon{ color:var(--copper-ink); }
  .node-group.active .node-icon{ color:var(--copper-ink); }
  .node-num circle{ fill:var(--surface-2); stroke:var(--line-strong); stroke-width:1.2; }
  .node-num text{ fill:var(--ink-faint); font-weight:600; }
  .node-group.reached .node-num circle, .node-group.active .node-num circle{ fill:var(--copper); stroke:var(--copper); }
  .node-group.reached .node-num text, .node-group.active .node-num text{ fill:#fff; }
  .node-title{ fill:var(--ink); font-weight:700; }
  .node-sub{ fill:var(--ink-faint); letter-spacing:.05em; }
  .segment{ stroke:var(--line-strong); stroke-width:2; fill:none; }
  .segment.passed{ stroke:var(--copper); }

  /* ---------- detail panel ---------- */
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:1.8rem; display:grid; grid-template-columns:auto 1fr; gap:1.6rem; }
  @media (max-width:640px){ .panel{grid-template-columns:1fr; padding:1.4rem;} }
  .panel-icon-wrap{ width:64px;height:64px; border-radius:14px; background:var(--copper-soft); border:1px solid var(--copper-soft-line); display:flex;align-items:center;justify-content:center; color:var(--copper-ink); flex-shrink:0; }
  .panel-icon-wrap svg{ width:38px;height:38px; }
  .panel-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
  .panel-step{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; }
  .panel-title{ margin:.15rem 0 0; font-size:1.4rem; font-weight:800; letter-spacing:-.01em; }
  .panel-sub{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--copper); letter-spacing:.08em; margin-top:.15rem; }
  .panel-desc{ margin:.9rem 0 0; color:var(--ink-soft); line-height:1.75; font-size:.95rem; max-width:68ch; }
  .cross-link{ display:inline-flex; align-items:center; gap:.6rem; margin-top:1rem; padding:.65rem 1rem; border-radius:10px; background:var(--copper-soft); border:1px solid var(--copper-soft-line); color:var(--copper-ink); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; font-weight:700; font-size:.88rem; cursor:pointer; transition:border-color .15s ease, background .15s ease, color .15s ease; }
  .cross-link:hover{ background:var(--copper); border-color:var(--copper); color:#fff; }
  .cross-link:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .cross-link-arrow{ font-family:'IBM Plex Mono',monospace; }
  .chip-label{ font-size:.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.1em; font-family:'IBM Plex Mono',monospace; margin:1.2rem 0 .55rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip{ display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .7rem; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:.83rem; color:var(--ink-soft); }
  .chip.tw{ background:var(--copper-soft); border:1px solid var(--copper-soft-line); color:var(--ink); font-weight:700; }
  .chip .tw-dot{ width:6px;height:6px;border-radius:50%; background:var(--copper); flex-shrink:0; }
  .chip .tw-tag{ font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--copper-ink); font-weight:700; letter-spacing:.04em; }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.8rem; margin-top:1.2rem; }
  .stat-tile{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:.75rem .9rem; }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-weight:600; font-size:1.25rem; color:var(--signal); }
  .stat-label{ font-size:.74rem; color:var(--ink-faint); margin-top:.15rem; line-height:1.4; }
  .breadcrumb{ display:inline-flex; align-items:center; background:none; border:none; padding:0; margin:0 0 .9rem; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--copper); cursor:pointer; }
  .breadcrumb:hover{ text-decoration:underline; }
  .breadcrumb:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .sub-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.6rem; margin-top:.9rem; }
  .sub-card{ display:flex; flex-direction:column; align-items:flex-start; gap:.5rem; padding:.75rem .8rem; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); cursor:pointer; text-align:left; font-family:inherit; color:var(--ink); transition:border-color .15s ease, background .15s ease; }
  .sub-card:hover{ border-color:var(--copper); background:var(--copper-soft); }
  .sub-card:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .sub-card svg{ width:26px;height:26px; color:var(--copper-ink); }
  .sub-card-title{ font-size:.82rem; font-weight:700; line-height:1.3; }
  .panel-nav{ display:flex; justify-content:space-between; margin-top:1.5rem; padding-top:1.1rem; border-top:1px solid var(--line); grid-column:1 / -1; }
  .nav-btn{ font-family:'IBM Plex Mono',monospace; font-size:.78rem; letter-spacing:.04em; background:none; border:1px solid var(--line); border-radius:8px; padding:.5rem .9rem; color:var(--ink); cursor:pointer; transition:border-color .15s ease, color .15s ease; }
  .nav-btn:hover{ border-color:var(--copper); color:var(--copper); }
  .nav-btn:focus-visible{ outline:2px solid var(--copper); outline-offset:2px; }
  .nav-btn[disabled]{ opacity:.35; cursor:default; }
  .nav-btn[disabled]:hover{ border-color:var(--line); color:var(--ink); }

  footer{ margin-top:2.2rem; padding-top:1.4rem; border-top:1px solid var(--line); }
  .sources-label{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:.5rem; }
  .sources-list{ margin:0 0 1rem; padding:0; list-style:none; display:flex; flex-direction:column; gap:.3rem; }
  .sources-list li{ font-size:.78rem; color:var(--ink-soft); }
  .disclaimer{ font-size:.74rem; color:var(--ink-faint); line-height:1.6; max-width:78ch; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

  var INDUSTRY_ORDER = Object.keys(INDUSTRIES);

  /* ============================================================
     繪圖／互動引擎　RENDER ENGINE — 通用，不需因新增產業而修改
     ============================================================ */
  var NS = "http://www.w3.org/2000/svg";
  var BOX_W = 220, BOX_H = 130, COL_GAP = 40, MARGIN = 70, ROW_GAP = 170, ROW_SIZE = 5;
  var TOP_Y = 30;

  function colFor(posInRow, rowIsEven){ return rowIsEven ? posInRow : (ROW_SIZE-1-posInRow); }

  function layout(n){
    var pos = [];
    for(var i=0;i<n;i++){
      var row = Math.floor(i/ROW_SIZE);
      var posInRow = i % ROW_SIZE;
      var col = colFor(posInRow, row%2===0);
      pos.push({ x: MARGIN + col*(BOX_W+COL_GAP), y: TOP_Y + row*ROW_GAP });
    }
    var rows = Math.ceil(n/ROW_SIZE);
    var viewH = TOP_Y + rows*BOX_H + (rows-1)*(ROW_GAP-BOX_H) + 30;
    return { pos:pos, viewH:viewH };
  }

  function el(tag, attrs){
    var e = document.createElementNS(NS, tag);
    for(var k in attrs){ e.setAttribute(k, attrs[k]); }
    return e;
  }

  var svg = document.getElementById("flowSvg");
  var segLayer = document.getElementById("segmentsLayer");
  var nodeLayer = document.getElementById("nodesLayer");
  var panel = document.getElementById("panel");
  var switcherEl = document.getElementById("switcher");
  var ledeEl = document.getElementById("lede");
  var metaEl = document.getElementById("metaRow");
  var sourcesEl = document.getElementById("sourcesList");
  var disclaimerEl = document.getElementById("disclaimer");

  var state = { industry:null, nodeEls:{}, segEls:[], nodes:[], current:0 };

  function renderSwitcher(){
    switcherEl.innerHTML = "";
    if(INDUSTRY_ORDER.length < 2){ switcherEl.style.display = "none"; return; }
    switcherEl.style.display = "flex";
    INDUSTRY_ORDER.forEach(function(key){
      var btn = document.createElement("button");
      btn.className = "tab" + (key===state.industry ? " active" : "");
      btn.textContent = INDUSTRIES[key].name;
      btn.addEventListener("click", function(){ selectIndustry(key); });
      switcherEl.appendChild(btn);
    });
  }

  function renderMeta(ind){
    ledeEl.textContent = ind.lede;
    metaEl.innerHTML = '<span>資料彙整：'+ind.updated+'</span><span><span class="dot"></span>節點反白＝台灣供應鏈廠商佔重要地位</span>';
    sourcesEl.innerHTML = ind.sources.map(function(s){ return "<li>"+s+"</li>"; }).join("");
    disclaimerEl.textContent = ind.disclaimer;
  }

  function buildDiagram(ind){
    segLayer.innerHTML = "";
    nodeLayer.innerHTML = "";
    state.nodeEls = {};
    state.segEls = [];
    state.nodes = ind.nodes;

    var L = layout(ind.nodes.length);
    svg.setAttribute("viewBox", "0 0 1400 " + L.viewH);

    for(var i=0;i<ind.nodes.length-1;i++){
      var a = L.pos[i], b = L.pos[i+1];
      var path;
      if(a.y !== b.y){
        var x = a.x + BOX_W/2;
        path = "M"+x+","+(a.y+BOX_H)+" L"+x+","+b.y;
      } else {
        var y = a.y + BOX_H/2;
        var x1, x2;
        if(b.x > a.x){ x1=a.x+BOX_W; x2=b.x; } else { x1=a.x; x2=b.x+BOX_W; }
        path = "M"+x1+","+y+" L"+x2+","+y;
      }
      var line = el("path", {class:"segment", d:path, "marker-end":"url(#arrow)"});
      segLayer.appendChild(line);
      state.segEls.push(line);
    }

    ind.nodes.forEach(function(node, i){
      var p = L.pos[i];
      var g = el("g", {class:"node-group", tabindex:"0", role:"button", "aria-pressed":"false",
        "aria-label":"第"+(i+1)+"步："+node.title});
      g.appendChild(el("rect", {class:"node-box", x:p.x, y:p.y, width:BOX_W, height:BOX_H, rx:14}));

      var iconSize = 34, iconX = p.x+BOX_W/2-iconSize/2, iconY = p.y+14;
      var use = el("use", {href:"#"+(node.icon||"icon-generic"), x:iconX, y:iconY, width:iconSize, height:iconSize});
      use.setAttribute("class","node-icon");
      g.appendChild(use);

      var title = el("text", {class:"node-title", x:p.x+BOX_W/2, y:p.y+72, "text-anchor":"middle", "font-size":"15.5"});
      title.textContent = node.title;
      g.appendChild(title);

      var sub = el("text", {class:"node-sub mono", x:p.x+BOX_W/2, y:p.y+94, "text-anchor":"middle", "font-size":"9"});
      sub.textContent = node.sub || "";
      g.appendChild(sub);

      var numG = el("g", {class:"node-num"});
      numG.appendChild(el("circle", {cx:p.x+BOX_W-18, cy:p.y+18, r:12}));
      var numText = el("text", {x:p.x+BOX_W-18, y:p.y+22, "text-anchor":"middle", "font-size":"11", class:"mono"});
      numText.textContent = String(i+1).padStart(2,"0");
      numG.appendChild(numText);
      g.appendChild(numG);

      g.addEventListener("click", function(idx){ return function(){ selectNode(idx); }; }(i));
      g.addEventListener("keydown", function(idx){ return function(e){
        if(e.key==="Enter"||e.key===" "){ e.preventDefault(); selectNode(idx); }
      }; }(i));

      nodeLayer.appendChild(g);
      state.nodeEls[i] = g;
    });
  }

  function chipsHtmlFor(companies){
    return (companies||[]).map(function(c){
      return '<span class="chip'+(c.tw?' tw':'')+'">' + (c.tw ? '<span class="tw-dot"></span><span class="tw-tag">TW</span>' : '') +
             '<span>'+c.n+'</span></span>';
    }).join("");
  }
  function statsHtmlFor(stats){
    return (stats||[]).map(function(s){
      return '<div class="stat-tile"><div class="stat-value mono">'+s.v+'</div><div class="stat-label">'+s.l+'</div></div>';
    }).join("");
  }

  function renderPanel(i){
    var node = state.nodes[i];
    var subGridHtml = "";
    if(node.children && node.children.length){
      subGridHtml = '<div class="chip-label">深入了解：細分環節</div><div class="sub-grid">' +
        node.children.map(function(child, ci){
          return '<button class="sub-card" data-child="'+ci+'">' +
            '<svg viewBox="0 0 40 40"><use href="#'+(child.icon||"icon-generic")+'"></use></svg>' +
            '<span class="sub-card-title">'+child.title+'</span>' +
          '</button>';
        }).join("") + '</div>';
    }
    var crossLinkHtml = "";
    if(node.crossLink){
      crossLinkHtml = '<button class="cross-link" id="crossLinkBtn" data-target="'+node.crossLink.industry+'">' +
        '<span>'+node.crossLink.text+'</span><span class="cross-link-arrow">→</span>' +
      '</button>';
    }

    panel.innerHTML =
      '<div class="panel-icon-wrap"><svg viewBox="0 0 40 40"><use href="#'+(node.icon||"icon-generic")+'"></use></svg></div>' +
      '<div class="panel-body">' +
        '<div class="panel-top"><div>' +
          '<div class="panel-step">STEP '+String(i+1).padStart(2,"0")+' / '+state.nodes.length+'</div>' +
          '<h2 class="panel-title">'+node.title+'</h2>' +
          '<div class="panel-sub">'+(node.sub||"")+'</div>' +
        '</div></div>' +
        '<p class="panel-desc">'+node.desc+'</p>' +
        crossLinkHtml +
        '<div class="chip-label">代表廠商</div>' +
        '<div class="chips">'+chipsHtmlFor(node.companies)+'</div>' +
        '<div class="stats">'+statsHtmlFor(node.stats)+'</div>' +
        subGridHtml +
        '<div class="panel-nav">' +
          '<button class="nav-btn" id="prevBtn" '+(i===0?"disabled":"")+'>‹ 上一步</button>' +
          '<button class="nav-btn" id="nextBtn" '+(i===state.nodes.length-1?"disabled":"")+'>下一步 ›</button>' +
        '</div>' +
      '</div>';

    document.getElementById("prevBtn").addEventListener("click", function(){ if(i>0) selectNode(i-1); });
    document.getElementById("nextBtn").addEventListener("click", function(){ if(i<state.nodes.length-1) selectNode(i+1); });

    if(node.children && node.children.length){
      Array.prototype.forEach.call(panel.querySelectorAll(".sub-card"), function(btn){
        btn.addEventListener("click", function(){
          renderChildPanel(i, parseInt(btn.getAttribute("data-child"), 10));
        });
      });
    }
    if(node.crossLink){
      document.getElementById("crossLinkBtn").addEventListener("click", function(){
        selectIndustry(node.crossLink.industry);
      });
    }
  }

  function renderChildPanel(parentIndex, childIndex){
    var parent = state.nodes[parentIndex];
    var child = parent.children[childIndex];

    panel.innerHTML =
      '<div class="panel-icon-wrap"><svg viewBox="0 0 40 40"><use href="#'+(child.icon||"icon-generic")+'"></use></svg></div>' +
      '<div class="panel-body">' +
        '<button class="breadcrumb" id="backBtn">‹ 返回「'+parent.title+'」</button>' +
        '<div class="panel-top"><div>' +
          '<div class="panel-step">'+parent.title+' ／ 細分環節</div>' +
          '<h2 class="panel-title">'+child.title+'</h2>' +
          '<div class="panel-sub">'+(child.sub||"")+'</div>' +
        '</div></div>' +
        '<p class="panel-desc">'+child.desc+'</p>' +
        '<div class="chip-label">代表廠商</div>' +
        '<div class="chips">'+chipsHtmlFor(child.companies)+'</div>' +
        '<div class="stats">'+statsHtmlFor(child.stats)+'</div>' +
        '<div class="panel-nav">' +
          '<button class="nav-btn" id="childPrev" '+(childIndex===0?"disabled":"")+'>‹ 上一類</button>' +
          '<button class="nav-btn" id="childNext" '+(childIndex===parent.children.length-1?"disabled":"")+'>下一類 ›</button>' +
        '</div>' +
      '</div>';

    document.getElementById("backBtn").addEventListener("click", function(){ renderPanel(parentIndex); });
    document.getElementById("childPrev").addEventListener("click", function(){ if(childIndex>0) renderChildPanel(parentIndex, childIndex-1); });
    document.getElementById("childNext").addEventListener("click", function(){ if(childIndex<parent.children.length-1) renderChildPanel(parentIndex, childIndex+1); });
  }

  function selectNode(i){
    state.current = i;
    state.nodes.forEach(function(_, idx){
      var g = state.nodeEls[idx];
      g.classList.remove("active","reached");
      g.setAttribute("aria-pressed", idx===i ? "true":"false");
      if(idx < i) g.classList.add("reached");
      if(idx === i) g.classList.add("active");
    });
    state.segEls.forEach(function(seg, idx){
      if(idx < i) seg.classList.add("passed"); else seg.classList.remove("passed");
    });
    renderPanel(i);
  }

  function selectIndustry(key){
    state.industry = key;
    var ind = INDUSTRIES[key];
    renderSwitcher();
    renderMeta(ind);
    buildDiagram(ind);
    selectNode(0);
  }

  selectIndustry(INDUSTRY_ORDER[0]);
})();
